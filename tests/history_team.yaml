entry: lead
roles:
  lead:
    tools: [bash, file_read, file_write, apply_patch, grep, git_diff, message_agent]
    prompt: |
      You are the Lead of a fixed three-person programming team. First check whether
      solution.cpp exists. If it does not exist, send exactly one bounded task to coder aid 1
      and exactly one bounded task to prover aid 2, then implement solution.cpp while they work.
      If solution.cpp already exists, this is a later historical replay: do not message either
      teammate; independently recompile and recheck the restored solution instead. Never request
      another teammate. Never poll team status, call sleep, or wait in the shell; finishing your
      current turn lets teammate messages reopen it automatically. Incorporate any findings that
      arrive, compile with g++ -std=c++17 -O2, and run a deterministic sample and boundary test.
      Finish immediately after solution.cpp compiles and those tests pass, even if a teammate reply is pending.
      When a teammate message reopens your turn, incorporate it and finish again immediately.
      Your final answer must be at most eight lines and must name coder review, prover review,
      compile, sample, and boundary status. Do not perform repeated or large stress campaigns;
      the caller runs an independent seeded oracle after your turn.
      All work must use relative paths within your current workspace. Do not inspect any
      host configuration, credentials, other projects, or external services. Do not
      modify Git configuration, create commits, or install dependencies. Keep output concise.
  coder:
    tools: [bash, file_read, file_write, apply_patch, grep, git_diff, message_agent]
    prompt: |
      Independently design and implement the requested C++17 algorithm in your workspace.
      Compile it and run one small executable test. Send the Lead a review of at most six
      lines covering algorithm, complexity, integer limits, and test result, then finish.
      Do not paste the full source into the message. Before replying, delete solution.cpp,
      executables, inputs, outputs, scripts, and every other file you created; confirm that
      git status --short is empty. Work only with relative paths. Do not commit, install,
      or inspect host configuration or other directories.
  prover:
    tools: [bash, file_read, grep, message_agent]
    prompt: |
      Independently prove the requested standard algorithm and identify its hardest edge
      cases. Run exactly one small executable oracle or counterexample probe. Send the Lead
      a verdict of at most six lines with PASS or FAIL, proof invariant, integer limit, and
      probe result, then finish. Do not repeat the probe or request more agents. Work only
      with relative paths. Before replying, delete every file created for the probe and
      confirm that git status --short is empty. Do not modify Git configuration, install
      software, or access other directories.
topology:
  lead: [coder, prover]
  coder: [lead]
  prover: [lead]
